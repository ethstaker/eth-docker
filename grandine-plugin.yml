# grandine-plugin.yml to be used with nethermind.yml for Nethermind with Grandine plugin plus Grandine VC
x-logging: &logging
  logging:
    driver: ${LOG_DRIVER}
    options:
      max-size: ${LOG_MAX_SIZE}
      max-file: ${LOG_MAX_FILE}
      tag: ${LOG_TAG}


x-build: &gr-build
  context: ./grandine
  dockerfile: ${GRANDINE_DOCKERFILE:-Dockerfile.binary}
  args:
    - BUILD_TARGET=${GRANDINE_SRC_BUILD_TARGET:-master}
    - SRC_REPO=${GRANDINE_SRC_REPO:-https://github.com/sifraitech/grandine}
    - DOCKER_TAG=${GRANDINE_DOCKER_TAG:-latest}
    - DOCKER_REPO=${GRANDINE_DOCKER_REPO:-sifrai/grandine}


services:
  execution:
    ports:
      # Grandine consensus P2P ports
      - "${HOST_IP:-}:${CL_P2P_PORT:-9000}:${CL_P2P_PORT:-9000}/tcp"
      - "${HOST_IP:-}:${CL_P2P_PORT:-9000}:${CL_P2P_PORT:-9000}/udp"
    environment:
      - CL_NODE_TYPE=${CL_NODE_TYPE:-pruned}
      - CL_EXTRAS=${CL_EXTRAS:-}
      - WEB3SIGNER=${WEB3SIGNER:-false}
      - W3S_NODE=${W3S_NODE}
      - CHECKPOINT_SYNC_URL=${CHECKPOINT_SYNC_URL}
      - JWT_SECRET=${JWT_SECRET}
      - MEV_BOOST=${MEV_BOOST}
      - EPBS_BUILD_FACTOR=${EPBS_BUILD_FACTOR}
      - MEV_NODE=${MEV_NODE}
      - BEACON_STATS_API=${BEACON_STATS_API}
      - BEACON_STATS_MACHINE=${BEACON_STATS_MACHINE}
      - VC_EXTRAS=${VC_EXTRAS:-}
      - GRAFFITI=${GRAFFITI:-}
      - DEFAULT_GRAFFITI=${DEFAULT_GRAFFITI:-false}
      - DOPPELGANGER=${DOPPELGANGER:-false}
      - IPV6=${IPV6:-false}
      - CL_P2P_PORT=${CL_P2P_PORT:-9000}
      - CL_QUIC_PORT=${CL_QUIC_PORT:-9001}
      - CL_REST_PORT=${CL_REST_PORT:-5052}
      - CL_MAX_PEER_COUNT=${CL_MAX_PEER_COUNT:-}
      - FEE_RECIPIENT=${FEE_RECIPIENT:-}
      - KEY_API_PORT=${KEY_API_PORT:-}
      - EMBEDDED_VC=false
      - RUST_LOG=${LOG_LEVEL:-info}
    volumes:
      - grandineconsensus-data:/var/lib/grandine
# No metrics scrape at present via labels.
# Create an extra scrape target for execution:8008 in prometheus/conf.d

  wipe-cl-db:
    profiles: ["tools"]
    restart: "no"
    image: alpine:3
    user: "10001"
    volumes:
      - grandineconsensus-data:/var/lib/grandine
      - /etc/localtime:/etc/localtime:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rm -rf /var/lib/grandine/${NETWORK}/beacon/*

  validator:
    restart: "unless-stopped"
    build:
      <<: *gr-build
    image: grandine:local
    pull_policy: never
    user: gdvalidator
    stop_grace_period: 1m
    volumes:
      - grandinevalidator-data:/var/lib/grandine-vc
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MEV_BOOST=${MEV_BOOST}
      - EPBS_BUILDERS=${EPBS_BUILDERS}
      - EPBS_BUILDER_URLS=${EPBS_BUILDER_URLS}
      - EPBS_BUILD_FACTOR=${EPBS_BUILD_FACTOR}
      - EPBS_MIN_BID=${EPBS_MIN_BID}
      - VC_EXTRAS=${VC_EXTRAS:-}
      - GRAFFITI=${GRAFFITI:-}
      - DEFAULT_GRAFFITI=${DEFAULT_GRAFFITI:-false}
      - WEB3SIGNER=${WEB3SIGNER:-false}
      - W3S_NODE=${W3S_NODE}
      - DOPPELGANGER=${DOPPELGANGER:-false}
      - ENABLE_DIST_ATTESTATION_AGGR=${ENABLE_DIST_ATTESTATION_AGGR:-false}
      - NETWORK=${NETWORK}
      - COMPOSE_FILE=${COMPOSE_FILE}
      - LOG_LEVEL=${LOG_LEVEL}
      - RUST_LOG=${LOG_LEVEL:-info}
    networks:
      default:
        aliases:
          # This allows multiple Eth Docker stacks all connected to the same bridge network
          - ${VC_ALIAS:-vc}
    <<: *logging
    entrypoint:
      - docker-entrypoint-vc.sh
      - grandine
      - vc
      - --data-dir
      - /var/lib/grandine-vc
      - --beacon-node-urls
      - ${CL_NODE}
      - --metrics
      - --metrics-address
      - 0.0.0.0
      - --metrics-port
      - "8009"
      - --suggested-fee-recipient
      - ${FEE_RECIPIENT}
      - --keystore-storage-password-file
      - /var/lib/grandine-vc/wallet-password.txt
      - --enable-validator-api
      - --validator-api-address
      - 0.0.0.0
      - --validator-api-port
      - ${KEY_API_PORT:-7500}
      - --validator-api-allowed-origins=*
    labels:
      - metrics.scrape=true
      - metrics.path=/metrics
      - metrics.port=8009
      - metrics.instance=validator
      - metrics.network=${NETWORK}
      - logs.collect=true

  validator-keys:
    profiles: ["tools"]
    restart: "no"
    build:
      context: ./vc-utils
    image: vc-utils:local
    pull_policy: never
    # The API token has 640 permissions. Root copies it,
    # then switches to the local user's UID or if not provided,
    # 1000. The UID has to be able to write .eth/validator_keys
    # for the "keys delete" command.
    user: root
    volumes:
      - grandinevalidator-data:/var/lib/grandine-vc
      - ./.eth/validator_keys:/validator_keys
      - ./.eth/exit_messages:/exit_messages
      - /etc/localtime:/etc/localtime:ro
    environment:
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-}
      - KEY_API_PORT=${KEY_API_PORT:-7500}
      - WEB3SIGNER=${WEB3SIGNER:-false}
      - W3S_NODE=${W3S_NODE}
      - CL_NODE=${CL_NODE}
    depends_on:
      - validator
    entrypoint:
      - keymanager.sh
      - /var/lib/grandine-vc/${NETWORK}/validator/api-token.txt
      - validator

volumes:
  grandineconsensus-data:
  grandinevalidator-data:
