name: Test TUI

defaults:
  run:
    shell: bash

# Runs on every PR: the catalog test fails when a yml file or variable is added without the TUI knowing it
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-tui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.15'
          enable-cache: true
          cache-dependency-glob: tui/uv.lock
      - name: Test catalog and config screen
        run: uv run --locked --project tui python -m unittest discover -s tui/tests -t tui/tests
