name: Scan Python dependencies for CVEs

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traefik-utils/app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.15'

      - name: Export locked dependencies
        run: uv export --locked --no-dev --format requirements.txt -o requirements.txt

      - name: Scan dependencies for known vulnerabilities
        run: uvx pip-audit -r requirements.txt --require-hashes --disable-pip
