name: Scan Python dependencies for CVEs

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - traefik-utils/app
          - .github/test-tools
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.15'

      - name: Export locked dependencies
        run: uv export --locked --no-dev --format requirements.txt -o requirements.txt

      - name: Scan dependencies for known vulnerabilities
        run: uvx pip-audit -r requirements.txt --require-hashes --disable-pip
