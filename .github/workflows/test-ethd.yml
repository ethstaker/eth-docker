name: Test ethd

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ethd:
    if: |
      contains(github.event.pull_request.labels.*.name, 'check-ethd') ||
      contains(github.event.pull_request.labels.*.name, 'test-all') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Prerequisites on Ubuntu
        run: |
          sudo apt-get install -y expect whiptail
          sudo apt-get remove -y podman
      - name: Use default.env
        run: cp default.env .env
      - name: Set old .env version
        run: |
          source ./.github/helper.sh
          ENV_VERSION=42
          var=ENV_VERSION
          set_value_in_env
          COMPOSE_FILE=teku.yml:besu.yml
          var=COMPOSE_FILE
          set_value_in_env
      - name: Test ethd update
        run: ./ethd update --debug --non-interactive
      - name: Remove .env
        run: rm .env
      - name: Test ethd config defaults
        run: expect -d ./.github/test-ethd-config.exp all-defaults
        env:
          TERM: xterm
      - name: Test ethd config no epbs
        run: expect -d ./.github/test-ethd-config.exp no-epbs
        env:
          TERM: xterm
      - name: Test ethd config no grafana
        run: expect -d ./.github/test-ethd-config.exp no-grafana
        env:
          TERM: xterm

  # The whole thing on macOS, Colima and a syncing client pair included. It does not fit in the
  # half hour the Ubuntu job takes, and Colima is slow enough that it is not worth running on
  # every push - so it waits for its own label.
  test-ethd-macos:
    if: contains(github.event.pull_request.labels.*.name, 'check-ethd-macos')
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker on macOS
        uses: douglascamata/setup-docker-macos-action@d5ccc6aae0ce23e7700154f5e63cc53e6433ac48
      - name: Prerequisites on macOS
        run: brew install bash newt coreutils expect gawk
      # Does whiptail draw at all under a pty on macOS, with ethd out of the picture?
      # newt emits its alternate-screen preamble the moment it initializes, so a match
      # here means the expect side is healthy and any later timeout is ethd being slow.
      - name: Probe expect and whiptail
        run: |
          type -a expect whiptail bash
          expect -v
          bash --version | head -1
          expect -c '
            set timeout 20
            spawn whiptail --notags --title "Select Network" --menu "Which network?" 15 65 2 hoodi Hoodi mainnet Mainnet
            expect {
              "Select Network" { puts "\nPROBE OK" ; exit 0 }
              timeout          { puts "\nPROBE TIMEOUT" ; exit 1 }
              eof              { puts "\nPROBE EOF" ; exit 1 }
            }'
        env:
          TERM: xterm
      # With stdin on /dev/null whiptail fails immediately, so this times exactly the
      # Docker and Compose preflight that runs before the first prompt.
      - name: Time ethd to first whiptail
        run: |
          cp default.env .env
          time ./ethd config --ci </dev/null || true
          rm -f .env
      - name: Use default.env
        run: cp default.env .env
      - name: Set old .env version
        run: |
          source ./.github/helper.sh
          ENV_VERSION=42
          var=ENV_VERSION
          set_value_in_env
          COMPOSE_FILE=teku.yml:besu.yml
          var=COMPOSE_FILE
          set_value_in_env
      - name: Test ethd update
        run: ./ethd update --debug --non-interactive
      - name: Remove .env
        run: rm .env
      - name: Test ethd config defaults
        run: expect -d ./.github/test-ethd-config.exp all-defaults
        env:
          TERM: xterm
      - name: Test ethd config no epbs
        run: expect -d ./.github/test-ethd-config.exp no-epbs
        env:
          TERM: xterm
      - name: Test ethd config no grafana
        run: expect -d ./.github/test-ethd-config.exp no-grafana
        env:
          TERM: xterm
