name: Test ethd

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ethd:
    if: |
      contains(github.event.pull_request.labels.*.name, 'check-ethd') ||
      contains(github.event.pull_request.labels.*.name, 'test-all') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prerequisites on Ubuntu
        run: |
          sudo apt-get install -y expect whiptail
          sudo apt-get remove -y podman
      - name: Use default.env
        run: cp default.env .env
      - name: Set old .env version
        run: |
          source ./.github/helper.sh
          ENV_VERSION=42
          var=ENV_VERSION
          set_value_in_env
          COMPOSE_FILE=teku.yml:besu.yml
          var=COMPOSE_FILE
          set_value_in_env
      - name: Test ethd update
        run: ./ethd update --debug --non-interactive
      - name: Test .env migration edge cases
        run: ./.github/test-ethd-migrate.sh
      - name: Remove .env
        run: rm .env
      - name: Test ethd config defaults
        run: expect -d ./.github/test-ethd-config.exp all-defaults
        env:
          TERM: xterm
      - name: Test ethd config no epbs
        run: expect -d ./.github/test-ethd-config.exp no-epbs
        env:
          TERM: xterm
      - name: Test ethd config no grafana
        run: expect -d ./.github/test-ethd-config.exp no-grafana
        env:
          TERM: xterm

  # The whole thing on macOS, Colima and a syncing client pair included. It does not fit in the
  # half hour the Ubuntu job takes, and Colima is slow enough that it is not worth running on
  # every push - so it waits for its own label.
  test-ethd-macos:
    if: contains(github.event.pull_request.labels.*.name, 'check-ethd-macos')
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker on macOS
        uses: douglascamata/setup-docker-macos-action@d5ccc6aae0ce23e7700154f5e63cc53e6433ac48
      - name: Prerequisites on macOS
        run: brew install bash newt coreutils expect gawk
      - name: Use default.env
        run: cp default.env .env
      - name: Set old .env version
        run: |
          source ./.github/helper.sh
          ENV_VERSION=42
          var=ENV_VERSION
          set_value_in_env
          COMPOSE_FILE=teku.yml:besu.yml
          var=COMPOSE_FILE
          set_value_in_env
      - name: Test ethd update
        run: ./ethd update --debug --non-interactive
      # The space report is the only path that always shows the Docker volume table, which is
      # otherwise only printed when the disk runs low. On macOS it uses gawk and busybox df.
      - name: Test ethd space
        run: ./ethd space
      # "keys prepare-address-change" downloads ethdo and jq on the host; macOS has no wget
      - name: Test GitHub release downloads
        run: ./.github/test-get-github-release.sh
      - name: Test .env migration edge cases
        run: ./.github/test-ethd-migrate.sh
      - name: Remove .env
        run: rm .env
      - name: Test ethd config defaults
        run: expect -d ./.github/test-ethd-config.exp all-defaults
        env:
          TERM: xterm
      - name: Test ethd config no epbs
        run: expect -d ./.github/test-ethd-config.exp no-epbs
        env:
          TERM: xterm
      - name: Test ethd config no grafana
        run: expect -d ./.github/test-ethd-config.exp no-grafana
        env:
          TERM: xterm
