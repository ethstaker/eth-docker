[project]
name = "ddns"
requires-python = ">=3.15,<4"
dependencies = [
    "boto3",
    "cloudflare",
    "requests",
    "tenacity",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["."]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "S"]
per-file-ignores = { "tests/**/*.py" = ["S101", "S108"] }
