---
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: check-ast
      - id: debug-statements
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: requirements-txt-fixer
      - id: check-toml

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 38980559e3a605691d6579f96222c30778e5a69e
    hooks:
      - id: shellcheck
      - id: script-must-have-extension
      - id: git-dirty
      - id: git-check
      - id: forbid-binary

  # Python formatting & linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Static typing
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 412de98d50e846f31ea6f4b0ad036f2c24a7a024
    hooks:
      - id: mypy
        additional_dependencies:
          - boto3-stubs[route53,sts]
          - types-requests

  # Security (lightweight)
  - repo: https://github.com/PyCQA/bandit
    rev: 2d0b675b04c80ae42277e10500db06a0a37bae17
    hooks:
      - id: bandit
        args: ["-q", "-ll", "-x", "tests"]

  # Spelling (nice quality-of-life)
  - repo: https://github.com/codespell-project/codespell
    rev: 63c8f8312b7559622c0d82815639671ae42132ac
    hooks:
      - id: codespell

  # Dockerfiles
  - repo: https://github.com/hadolint/hadolint
    rev: 87de847754330ad47ae16bdfe2d1a757ccb4b4d4
    hooks:
      - id: hadolint-docker

  # YAML style (beyond syntax)
  - repo: https://github.com/adrienverge/yamllint
    rev: 79a6b2b1392eaf49cdd32ac4f14be1a809bbd8f7
    hooks:
      - id: yamllint
        args:
          - -d
          - >
            {extends: default, rules: {line-length: {max: 120},document-start: disable,truthy: disable}}
