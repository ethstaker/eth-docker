# What the TUI can configure: roles, the clients and add-ons for each, and which .env
# variables belong to them. Defaults and help text come from default.env, not from here.
#
# role.choice     pick one, or none. "files" go into CORE_FILES
# role.addon      independent toggles
# role.exposure   publish a port to the host ("shared" file) and/or route via traefik
# requires        { role = [choice ids] }, "*" is any choice. Not met is an error
# forces          variables a choice forces, none_forces what the role forces when nothing is chosen
# none_vars       shown when the role has no choice, to point at an external service
# image           prefixes of the *_DOCKER_TAG, *_DOCKERFILE etc. variables
# hide            role variables this choice does not use
# ports           variables published on the host while selected, checked for conflicts

# CL and VC of the same client share one yml
combined = [
  { cl = "grandine", vc = "grandine", file = "grandine.yml" },
  { cl = "lighthouse", vc = "lighthouse", file = "lighthouse.yml" },
  { cl = "lodestar", vc = "lodestar", file = "lodestar.yml" },
  { cl = "nimbus", vc = "nimbus", file = "nimbus.yml" },
  { cl = "prysm", vc = "prysm", file = "prysm.yml" },
  { cl = "teku", vc = "teku", file = "teku.yml" },
]

# Never offered. Kept in CORE_FILES as-is if a .env already has them
legacy = [
  "allin1-keyapi-shared.yml",
  "grandine-allin1.yml",
  "grandine-plugin-allin1.yml",
  "nimbus-allin1.yml",
  "teku-allin1.yml",
]

# Added by the TUI itself when needed, never chosen
derived = ["grafana-for-vc.yml"]

# Variables ethd manages, or that only exist inside compose
internal = [
  "ALLOY_PROJECT_NAME",
  "COMPOSE_FILE",
  "CORE_FILES",
  "DOCKER_ROOT",
  "DOCKER_ROOT_MOUNTPOINT",
  "DOCKER_SOCK",
  "ENV_VERSION",
  "KEYSTORE_PASSWORD",
  "XDG_RUNTIME_DIR",
]

[enums]
NETWORK = ["hoodi", "sepolia", "ephemery", "mainnet", "gnosis"]
CL_NODE_TYPE = ["pruned", "full", "archive", "blob-archive", "aggressive-pruned"]
EL_NODE_TYPE = ["pre-merge-expiry", "rolling-expiry", "full", "archive", "stakewise-expiry", "custom", "use-cl-zkproofs"]
LOG_LEVEL = ["info", "debug", "warn", "error"]

[labels]
NETWORK = "Network"
FEE_RECIPIENT = "Fee recipient"
IPV6 = "IPv6 P2P"
HOST_IP = "Host IP"
SHARE_IP = "Share IP"
LOG_LEVEL = "Log level"
CUSTOM_FILES = "Custom yml files"
EL_NODE = "External execution client"
JWT_SECRET = "JWT secret"
EL_NODE_TYPE = "Node type"
EL_P2P_PORT = "P2P port"
CL_NODE = "External consensus client(s)"
CHECKPOINT_SYNC_URL = "Checkpoint sync URL"
CL_NODE_TYPE = "Node type"
CL_P2P_PORT = "P2P port"
CL_QUIC_PORT = "QUIC port"
GRAFFITI = "Graffiti"
DEFAULT_GRAFFITI = "Client default graffiti"
DOPPELGANGER = "Doppelganger protection"
W3S_NODE = "External Web3signer"
MEV_NODE = "External MEV service"
MEV_RELAYS = "Relays"
EPBS_BUILDERS = "Use ePBS builders"
EPBS_MIN_BID = "Minimum bid"
EPBS_BUILD_FACTOR = "Build factor"
RPC_URLS = "Upstream RPC URLs"
DOMAIN = "Domain"
ACME_EMAIL = "Let's Encrypt email"
DDNS_HOST = "DDNS host record"
CNAME_LIST = "CNAME records"

