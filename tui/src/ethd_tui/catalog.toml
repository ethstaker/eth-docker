  "HOST_IP", "SHARE_IP", "LOG_LEVEL", "LOG_DRIVER", "LOG_MAX_SIZE", "LOG_MAX_FILE", "LOG_TAG",
  "ETH_DOCKER_TAG", "CUSTOM_FILES",
]

